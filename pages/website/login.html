<!DOCTYPE html>
<html lang="en">
<head>
	<base href="../../">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="author" content="nojjia">
	<meta name="description" content="Quiet Fisher - A game about fishing in a peacefull lake.  But, as you move to deeper levels, some secrets get uncovered...">
	
	<title>Login Page - Quiet Fisher</title>
	<link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
	<link rel="stylesheet" href="style/main-website.css">

	<script type="module" src="script/main.js"></script>
</head>
<body>
	<div id="background"></div>
	<img class="background" id="cloud-1" src="assets/images/cloud-1.svg">
	<img class="background" id="cloud-2" src="assets/images/cloud-2.svg">
	<img class="background" id="cloud-3" src="assets/images/cloud-3.svg">
	<img class="background" id="cloud-4" src="assets/images/cloud-4.svg">
	<!--
		N   N     A     V       V BBBB      A     RRRR
		NN  N    A A     V     V  B   B    A A    R   R
		N N N   A   A     V   V   BBBB    A   A   RRRR
		N  NN  AAAAAAA     V V    B   B  AAAAAAA  R RR
		N   N A       A     V     BBBB  A       A R   R
	-->
	<header id="navbar">
		<div id="left">
			<a id="guest-account" class="button guest" href="pages/game/menu.html">Guest</a>
		</div>
		<div id="center">
			<a id="home" href="index.html">
				<img src="assets/images/home.png" alt="home">
			</a>
			<img id="game-title" src="assets/images/logo.png" alt="logo">
			<a id="leaderboard" href="pages/leaderboard.html">
				<img src="assets/images/leaderboard.png" alt="leaderboard">
			</a>
		</div>
		<div id="right">
			<a class="button login" href="pages/website/login.html">Log In</a>
			<a class="button signup" href="pages/website/signup.html">Sign Up</a>
		</div>
	</header>

	<!--
		M   M     A     IIIIIIII N   N
		MM MM    A A       II    NN  N
		M M M   A   A      II    N N N
		M   M  AAAAAAA     II    N  NN
		M   M A       A IIIIIIII N   N
	-->
	<main id="main">
		<div class="card">
			<div id="account">
				<div class="title">Log In</div>
				<div class="input-area">
					<label class="account-label" for="username">Username:</label>
					<input id="username" name="username" type="text" placeholder="Enter your username...">
					<label class="account-label" for="password">Password:</label>
					<input id="password" name="password" type="password" placeholder="Enter your password...">
					<div id="password-issue"></div>
				</div>
				<a class="link-left" href="pages/website/signup.html">I don't have an account!</a>
				<a class="link-right" href="#">Forgot Password</a>
				<button id="login" class="button submit">Log In</button>
			</div>
		</div>
	</main>
	<!--
		FFFFFF  OOO   OOO  TTTTTTTT EEEEEE RRRR
		F      O   O O   O    TT    E      R   R
		FFFFF  O   O O   O    TT    EEEEE  RRRR
		F      O   O O   O    TT    E      R RR
		F       OOO   OOO     TT    EEEEEE R   R
	-->
	<footer id=".footer">
		<div id="footer-left">
			<a class="icon nf nf-cod-mail"href="mailto:nojjia@proton.me" ></a>
			<a class="icon nf nf-fa-discord"href="https://discord.com/users/562641071159640084" ></a>
		</div>
		<div id="footer-right">
			<a class="icon nf nf-md-web"href="https://nojjia.github.io/" ></a>
			<a class="icon nf nf-linux-codeberg"href="https://github.com/Nojjia" ></a>
			<a class="icon nf nf-cod-github"href="https://codeberg.org/Nojjia" ></a>
		</div>
	</footer>
</body>
</html>
