	<meta name="description" content="Quiet Fisher - A game about fishing in a peacefull lake.  But, as you move to deeper levels, some secrets get uncovered...">

	<title>Leaderboard Page - Quiet Fisher</title>

	<div id="background"></div>
	<img class="background" id="cloud-1" src="assets/images/cloud-1.svg">
	<img class="background" id="cloud-2" src="assets/images/cloud-2.svg">
	<img class="background" id="cloud-3" src="assets/images/cloud-3.svg">

		N   N     A     V       V BBBB      A     RRRR

		N   N A       A     V     BBBB  A       A R   R
	-->
	<header id="navbar">
		<div id="left">
			<a id="guest-account" class="button guest" href="pages/game/menu.html">Guest</a>
		</div>
		<div id="center">
			<a id="home" href="index.html">
				<img src="assets/images/home.svg" alt="home">
			</a>
			<img id="game-title" src="assets/images/logo.svg" alt="logo">
			<a id="leaderboard" href="pages/leaderboard.html">
				<img src="assets/images/leaderboard.svg" alt="leaderboard">
			</a>
		</div>
		<div id="right">
			<a class="button login" href="pages/website/login.html">Log In</a>
			<a class="button signup" href="pages/website/signup.html">Sign Up</a>
		</div>
	</header>
	<!--
		M   M     A     IIIIIIII N   N

		M M M   A   A      II    N N N
		M   M  AAAAAAA     II    N  NN
		M   M A       A IIIIIIII N   N
	-->
	<main id="main">
		<div id='card'>
			<div id='leaderboard_levels'>
				<div id='level_1'>AREA BEGINNER</div>
				<div id='level_2'>AREA INTERMEDIATE</div>
				<div id='level_3'>AREA ADVANCED</div>
			</div>
			<div id='leaderboard_table'>
				<div id='leaderboard_heading'>
					<span id='leaderboard_index_title'>
						#
					</span>
					<h1 id='leaderboard_username_title'>
						Username
					</h1>
					<h1 id='leaderboard_time_title'>
						Time (Ms)
					</h1>
				</div>
				<div id='leaderboard_table_body'></div>
			</div>
		</div>
	</main>
	<!--
		FFFFFF  OOO   OOO  TTTTTTTT EEEEEE RRRR
		F      O   O O   O    TT    E      R   R
